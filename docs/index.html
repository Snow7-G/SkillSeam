<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SkillSeam · find the seam where your skills split</title>
<style>
:root {
  --bg: #f5f4f0; --surface: #ffffff; --surface-soft: #f8f7f3;
  --border: #d3d1c7; --border-strong: #b4b2a9;
  --text: #2c2c2a; --text-2: #5f5e5a; --text-3: #888780;
  --accent: #0f6e56; --accent-hover: #085041; --accent-soft: #e1f5ee;
  --danger: #a32d2d; --danger-strong: #e24b4a; --danger-soft: #fcebeb;
  --danger-chip: #f7c1c1; --danger-text: #791f1f;
  --success: #3b6d11; --success-soft: #eaf3de; --success-border: #c0dd97; --success-text: #27500a;
  --r-sm: 8px; --r-md: 12px; --r-pill: 999px;
  --shadow-card: 0 1px 2px rgba(44, 44, 42, .05);
  --focus: 0 0 0 3px rgba(15, 110, 86, .18);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
       background: var(--bg); color: var(--text); padding: 32px 16px; line-height: 1.6;
       -webkit-font-smoothing: antialiased; }
.wrap { max-width: 960px; margin: 0 auto; }
h1 { font-size: 21px; font-weight: 500; letter-spacing: .2px; }
h1 .em { color: var(--accent); }
.sub { color: var(--text-2); font-size: 13px; margin: 8px 0 24px; line-height: 1.7; }
.card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-md);
        padding: 20px 22px; margin-bottom: 16px; box-shadow: var(--shadow-card); }
h2 { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
label { font-size: 12.5px; color: #444441; display: block; margin: 12px 0 4px; }
textarea, input[type=text], input[type=password], select {
  width: 100%; border: 0.5px solid var(--border-strong); border-radius: var(--r-sm); padding: 8px 10px;
  font: 13px/1.5 ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  background: var(--surface); color: var(--text); transition: border-color .15s, box-shadow .15s; }
textarea:focus, input[type=text]:focus, input[type=password]:focus, select:focus {
  outline: none; border-color: var(--accent); box-shadow: var(--focus); }
textarea { resize: vertical; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.grid3 { display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 0 16px; }
@media (max-width: 640px) {
  .grid2, .grid3 { grid-template-columns: 1fr; }
  body { padding: 20px 10px; }
  .cards { gap: 8px; }
  .stat { min-width: 100px; padding: 10px 14px; }
}
button { background: var(--accent); color: #fff; border: 0; border-radius: var(--r-sm);
         padding: 10px 22px; font-size: 14px; cursor: pointer; margin-top: 16px;
         transition: background .15s; }
button:hover:not(:disabled) { background: var(--accent-hover); }
button.ghost { background: var(--surface); color: var(--accent);
               border: 0.5px solid var(--accent); margin-right: 8px; }
button.ghost:hover:not(:disabled) { background: var(--accent-soft); }
button:focus-visible { outline: none; box-shadow: var(--focus); }
button:disabled { opacity: .45; cursor: default; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 8px; line-height: 1.65; }
.errbox { background: var(--danger-soft); color: var(--danger-text); border-radius: var(--r-sm);
          padding: 10px 14px; font-size: 13px; margin-top: 12px; display: none;
          white-space: pre-wrap; line-height: 1.65; }
.bar { height: 8px; background: #e5e3dd; border-radius: 4px; margin-top: 12px;
       overflow: hidden; display: none; }
.bar div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.stat { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--r-md);
        padding: 12px 18px; min-width: 120px; box-shadow: var(--shadow-card); }
.stat .num { font-size: 24px; font-weight: 500; line-height: 1.3; }
.stat .lbl { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.stat.red .num { color: var(--danger); } .stat.green .num { color: var(--success); }
#skillStrip { margin-top: 12px; font-size: 12.5px; color: var(--text-2); line-height: 2; }
#skillStrip .skill-chip { margin: 0 3px; }
#matrix { overflow-x: auto; }
.conflict { border-left: 3px solid var(--danger-strong); padding: 10px 14px; background: var(--danger-soft);
            border-radius: 0 var(--r-sm) var(--r-sm) 0; margin-bottom: 8px; font-size: 13px; line-height: 1.65; }
.plain { border-left: 3px solid var(--border-strong); padding: 10px 14px; background: var(--surface-soft);
         border-radius: 0 var(--r-sm) var(--r-sm) 0; margin-bottom: 8px; font-size: 13px; line-height: 1.65; }
.badge { display: inline-block; background: var(--danger-chip); color: var(--danger-text);
         border-radius: 4px; padding: 0 6px; font-size: 12px; margin: 0 2px; }
.skill-chip { display: inline-block; padding: 1px 9px; border-radius: var(--r-pill);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12px;
  font-weight: 500; color: #0c447c; vertical-align: baseline; line-height: 1.6;
  background: rgba(255, 255, 255, .55);
  border: 1px solid rgba(255, 255, 255, .85);
  box-shadow: 0 1px 3px rgba(44, 44, 42, .08), inset 0 1px 0 rgba(255, 255, 255, .9);
  backdrop-filter: blur(10px) saturate(1.5); -webkit-backdrop-filter: blur(10px) saturate(1.5); }
.skill-chip.red { color: var(--danger-text); background: rgba(255, 240, 240, .6);
  border-color: rgba(247, 193, 193, .85); }
.skill-chip.none { color: var(--text-2); background: rgba(241, 239, 232, .55);
  border-color: rgba(211, 209, 199, .85); }
.fix { border-left: 3px solid var(--success); padding: 10px 14px; background: var(--success-soft);
       border-radius: 0 var(--r-sm) var(--r-sm) 0; margin-bottom: 8px; font-size: 13px; line-height: 1.65; }
.fixold { background: var(--danger-soft); border: 0.5px solid var(--danger-chip); border-radius: 6px;
          padding: 6px 10px; margin: 6px 0; color: var(--danger-text); }
.fixnew { background: var(--surface); border: 0.5px solid var(--success-border); border-radius: 6px;
          padding: 6px 10px; margin: 6px 0; color: var(--success-text); }
.fixreason { color: var(--text-2); font-size: 12px; margin-top: 4px; }
svg text { font-family: inherit; }
.langbar { display: flex; gap: 4px; margin: 10px 0 0; }
.langbar button { margin-top: 0; padding: 3px 12px; font-size: 12px;
  background: var(--surface); color: var(--text-2);
  border: 0.5px solid var(--border-strong); border-radius: var(--r-pill); }
.langbar button:hover:not(:disabled) { background: var(--surface-soft); color: var(--text); }
.langbar button.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.rowbtns { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.rowbtns button { margin-top: 12px; }
.rowbtns .hint { margin-top: 12px; }
.hidden { display: none; }
code { background: #efede7; border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>SkillSeam <span class="em">· find the seam where your skills split</span></h1>
  <div class="langbar" id="langbar">
    <button type="button" data-lang="zh">中文</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <div class="sub" data-i18n="sub"></div>

  <div class="card">
    <h2 data-i18n="card1_title"></h2>
    <label data-i18n="skills_label"></label>
    <textarea id="skills" rows="6"></textarea>
    <div class="rowbtns">
      <button class="ghost" onclick="pickSkillsFolder()" data-i18n="pick_folder"></button>
      <span class="hint" id="pickHint" data-i18n="pick_hint"></span>
    </div>
    <input type="file" id="folderInput" webkitdirectory multiple class="hidden">
    <label data-i18n="tasks_label"></label>
    <textarea id="tasks" rows="6"></textarea>
    <div class="hint" data-i18n="tasks_hint"></div>
  </div>

  <div class="card">
    <h2 data-i18n="card2_title"></h2>
    <div class="grid3">
      <div>
        <label>Provider</label>
        <select id="provider">
          <option value="demo" data-i18n="provider_demo"></option>
          <option value="openai">OpenAI-compatible</option>
          <option value="openrouter">OpenRouter</option>
          <option value="gemini">Gemini</option>
          <option value="anthropic">Anthropic (Claude)</option>
        </select>
      </div>
      <div>
        <label>API Key</label>
        <input type="password" id="key" data-i18n-ph="key_ph">
      </div>
      <div>
        <label data-i18n="model_label"></label>
        <input type="text" id="model" placeholder="gpt-4o-mini / claude-sonnet-4-5 / ...">
      </div>
    </div>
    <div id="baseRow" class="hidden">
      <label data-i18n="base_label"></label>
      <input type="text" id="base" data-i18n-ph="base_ph">
    </div>
    <div class="grid2">
      <div>
        <label data-i18n="samples_label"></label>
        <select id="samples"><option>1</option><option>3</option><option selected>5</option><option>8</option></select>
      </div>
      <div>
        <label data-i18n="remember_label"></label>
        <input type="checkbox" id="remember" checked style="width:auto">
      </div>
    </div>
    <div class="grid2">
      <div>
        <label data-i18n="genpos_label"></label>
        <select id="genPos"><option>3</option><option selected>5</option><option>8</option></select>
      </div>
      <div>
        <label data-i18n="graypairs_label"></label>
        <select id="grayPairs"><option>0</option><option selected>2</option><option>3</option></select>
      </div>
    </div>
    <button id="demoBtn" class="ghost" onclick="loadDemo()" data-i18n="demo_btn"></button>
    <button id="genBtn" class="ghost" onclick="genTasks()" data-i18n="gen_btn"></button>
    <button id="runBtn" onclick="run()" data-i18n="run_btn"></button>
    <button id="stopBtn" class="ghost hidden" onclick="stopEval()" data-i18n="stop_btn"></button>
    <div class="bar" id="bar"><div id="barfill"></div></div>
    <div class="errbox" id="errbox"></div>
    <div class="hint" data-i18n="run_hint"></div>
  </div>

  <div id="result" class="hidden">
    <div class="cards">
      <div class="stat green"><div class="num" id="s-hit">-</div><div class="lbl" data-i18n="stat_hit"></div></div>
      <div class="stat red"><div class="num" id="s-conf">-</div><div class="lbl" data-i18n="stat_conf"></div></div>
      <div class="stat"><div class="num" id="s-unstable">-</div><div class="lbl" data-i18n="stat_unstable"></div></div>
      <div class="stat"><div class="num" id="s-total">-</div><div class="lbl" data-i18n="stat_total"></div></div>
    </div>
    <div id="skillStrip"></div>
    <div class="card"><h2 data-i18n="matrix_title"></h2><div id="matrix"></div>
      <div class="hint" data-i18n="matrix_hint"></div></div>
    <div class="card"><h2 data-i18n="conflicts_title"></h2><div id="conflicts"></div></div>
    <div class="card hidden" id="fixCard"><h2 data-i18n="fixes_title"></h2><div id="fixes"></div></div>
    <div class="card"><h2 data-i18n="plains_title"></h2><div id="plains"></div></div>
  </div>
</div>

<script>
"use strict";

// ---------- i18n：界面文案字典（zh / en）----------
// 语言解析优先级：?lang=xx → localStorage → 浏览器语言（zh* → 中文，其余 → 英文）
var I18N = {

    card1_title: "1 · 输入",
    skills_label: "技能清单（每行一个，格式 <code>name: description</code>，至少 2 个）",
    skills_ph: "guahao-yuyue: 处理眼科门诊的预约挂号、改期与取消\nbaogao-jiedu: 解读眼科检查报告，涵盖视力、眼压、OCT 等指标含义\nfuzhen-tixing: 为术后与慢病患者制定复诊计划、发送复查提醒",
    pick_folder: "选择技能文件夹",
    pick_hint: "从本机读取 SKILL.md，全程在浏览器内解析，不上传任何文件。",
    tasks_label: "测试任务（每行一条。可加 <code>=&gt; skill-name</code> 标注应选技能参与冲突判定；不标注则只做一致性分析）",
    tasks_ph: "我上周查的视力报告，能帮我看一下吗？ => baogao-jiedu\n我想预约下周三上午的眼科门诊 => guahao-yuyue\n复诊的时候顺便帮我查下会员积分余额 => fuzhen-tixing\n帮我看看最近有什么会员活动",
    tasks_hint: "冲突判定需要「应选技能」标注；没标注的任务 agent 会给出选择与一致率，由你人工判断选得对不对。",
    card2_title: "2 · 模型端点（BYOK）",
    provider_demo: "演示模式（内置真实数据，无需 key）",
    key_ph: "sk-...（只存你的浏览器）",
    model_label: "模型",
    base_label: "Base URL（OpenAI-compatible 端点地址）",

    samples_label: "每任务采样次数",
    remember_label: "记住配置（含 key，存 localStorage）",
    genpos_label: "自动生成：每技能正向任务数",
    graypairs_label: "自动生成：灰区技能对数（按语义重叠挑）",
    demo_btn: "看演示数据",
    gen_btn: "自动生成任务",
    run_btn: "开始模拟",
    stop_btn: "停止评测",
    run_hint: "采样次数越多结论越稳，费用与耗时线性增加。判定规则：5 次采样至少 4 次同结果为「稳定」；应选标注的任务若稳定选中其他技能即「截胡」。自动生成会先让模型挑出最易混淆的技能对，再为每对双向生成边界问法——生成后建议人工过一遍再模拟。",
    stat_hit: "标注任务命中", stat_conf: "稳定冲突（截胡）",
    stat_unstable: "不稳定（未达一致率）", stat_total: "任务总数",
    matrix_title: "选择混淆矩阵",
    matrix_hint: "行 = 应选技能，列 = agent 实际选中。对角线 = 正确命中；红色 = 被截胡，颜色越深次数越多。未标注的任务不进矩阵。",
    conflicts_title: "冲突明细", fixes_title: "修复建议（AI 生成，改后请重跑验证）",
    plains_title: "未标注任务的选择结果（请人工确认）",
    pick_reading: "正在读取 {n} 个 SKILL.md ...",
    pick_not_found: "未找到 SKILL.md。请选择「技能名/SKILL.md」结构的目录（如 ~/.codex/skills）。",
    pick_only_hidden: "只有隐藏目录（如 .system/）里有 SKILL.md，已按惯例跳过{skip}。如需检测请直接选择该目录。",
    pick_no_desc: "读取到 SKILL.md 但都没有可用 description，请检查文件格式。",
    pick_done: "已读取 {n} 个技能{skipped}{skip}。全程在浏览器内解析，未上传。",

    skip_list: "，跳过 {n} 个：{list}",

    err_need_two: "至少需要 2 个技能",
    err_gen_endpoint: "自动生成需要真实模型端点：请选择 Provider 并填写 Key",
    err_need_key: "请填写 API Key",
    err_need_base: "OpenAI-compatible 需要填写 Base URL",
    err_need_model: "请填写模型名",
    err_samples: "采样次数无效：请选择 1-8 之间的整数。",
    run_stopped: "评测已停止，结果不完整（已完成的请求已计入）。",
    gen_status: "正在生成任务（{s} 技能 × {p} 正向 + {k} 对灰区）...",
    gen_empty: "任务生成结果为空",
    gen_partial: "部分生成跳过：{w}。已追加 {n} 条到任务框。",
    gen_done: "已生成 {n} 条任务并追加到任务框（可编辑后点「开始模拟」）。注意：生成任务存在「生成者偏见」（出题模型知道意图），冲突结论请以真实用户问法为准。",
    gen_pos_failed: "正向任务生成失败，已跳过", gen_gray_failed: "灰区任务生成失败，已跳过",
    strip_recognized: "已识别 {n} 个技能：",
    conflict_expect: "应选 {a}，实际被 {b} 截胡",
    conflict_overtake: "应不触发任何技能，却被 {b} 接管",
    votes: "（{n}/{m} 票）", keywords: "截胡关键词：",
    eval_failed: "评测失败：没有取得任何有效的选择结果（请求失败或响应不可解析）。不能视为无冲突。请检查 Key、模型名或端点后重试。",
    no_conflicts: "标注任务中未发现稳定冲突。想暴露边界问题，多写几条两两语义交界的模糊问法（用 => 标注你认为是正确归属的一方）。",
    plain_line: "「{task}」→ agent 选中 {chosen}",
    unstable_note: "（不稳定 {n}/{m} 票，仅供参考）",
    no_plains: "没有未标注任务。给部分任务去掉 => 标注，可以看看 agent 的自然选择。",
    fixes_generating: "发现 {n} 个稳定冲突，正在生成修复建议...",
    fix_no_suggestions: "未能自动生成建议。可按冲突明细里的截胡关键词手动改 description：给截胡方加「仅限/不含」边界词。",
    fix_head: "修改 {name}", fix_note: "（冲突：{victim} 被 {thief} 截胡）",
    fix_old: "改前", fix_new: "改后", fix_reason: "理由：",
    matrix_axis: "列 = agent 实际选中 →（行 = 应选技能）", col_other: "其他",
    votes_raw: "（{x}）",
    prompt_select: "你是客服 agent 的技能选择器。下面给出可用技能列表（仅名称与描述）。收到用户任务后，选出最合适的一个技能名称；若没有任何技能合适，输出 NONE。只输出 JSON：{\"chosen\": \"<name|NONE>\"}，不要输出其他内容。",
    prompt_catalog: "可用技能：\n{catalog}\n\n用户任务：{task}",
    prompt_gen_sys: "你是测试用例生成器，只输出 JSON。",
    prompt_gen_pos: "根据技能的名称与描述，写 {n} 条真实用户可能提出的任务问法。要求：第一人称、口语化、句式多样、长短不一；不要出现技能名称本身；不要任何解释。只输出 JSON 数组：[\"任务1\", \"任务2\", ...]",
    prompt_gen_gray: "红队任务：下面两个技能的职责存在语义重叠。你的目标是写出最刁钻的用户问法——让 agent 极难判断该归 A 还是 B、甚至干脆选错的那种。问法要像真实用户的随意口吻：可以夹杂场景细节、模糊指代，两个技能的关键词各带一点。请写 {n} 组边界问法：每组两条，第一条正确答案应归技能A，第二条应归技能B，组内两条要高度相似以形成边界测试。只输出 JSON：{\"first\": [\"偏向A的问法\"...], \"second\": [\"偏向B的问法\"...]}",
    prompt_gen_pairs: "以下是 {n} 个客服 agent 技能的名称与描述：\n{listing}\n\n请找出职责最容易互相重叠、用户任务容易混淆的 {k} 对技能（按混淆可能性从高到低）。只输出 JSON：{\"pairs\": [[\"技能名1\", \"技能名2\"], ...]}",
    prompt_skill_name: "技能名称：", prompt_skill_desc: "\n技能描述：",

// 纯函数：?lang=xx → localStorage → 浏览器语言（zh* → 中文，其余 → 英文）
function resolveLang(query, stored, navLang) {
  function valid(l) { return l && I18N[l] ? l : null; }
  var q = null;
  try { q = new URLSearchParams(query || "").get("lang"); } catch (e) {}
  return valid(q) || valid(stored) || ((String(navLang || "en").toLowerCase().indexOf("zh") === 0) ? "zh" : "en");
}

var LANG = (function() {
  var stored = null;
  try { stored = localStorage.getItem("atlas_lang"); } catch (e) {}
  return resolveLang(location.search, stored, navigator.language);
})();

function t(key, vars) {
  var s = (I18N[LANG] && I18N[LANG][key]) || I18N.zh[key] || key;
  if (vars) {
    Object.keys(vars).forEach(function(k) {
      s = s.split("{" + k + "}").join(vars[k]);
    });
  }
  return s;
}

function applyI18n() {
  document.documentElement.lang = LANG === "zh" ? "zh-CN" : LANG;
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n]"), function(el) {
    el.innerHTML = t(el.getAttribute("data-i18n"));
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-i18n-ph]"), function(el) {
    el.placeholder = t(el.getAttribute("data-i18n-ph"));
  });
  ["skills", "tasks"].forEach(function(id) {
    var el = document.getElementById(id);
    if (el && el.getAttribute("data-ph-set") !== LANG) {
      if (!el.value.trim()) el.placeholder = t(id === "skills" ? "skills_ph" : "tasks_ph");
      el.setAttribute("data-ph-set", LANG);
    }
  });
  var bar = document.getElementById("langbar");
  if (bar) {
    Array.prototype.forEach.call(bar.querySelectorAll("button"), function(b) {
      b.classList.toggle("on", b.getAttribute("data-lang") === LANG);
    });
  }
  if (typeof refreshPickHint === "function") refreshPickHint();
  var ph = document.getElementById("pickHint");
  if (ph && !ph.textContent.trim()) ph.textContent = t("pick_hint");
}

// 切换语言：原地刷新文案并重绘结果（不重载页面，textarea 内容不丢）
function setLang(lang) {
  if (!I18N[lang] || lang === LANG) return;
  LANG = lang;
  try { localStorage.setItem("atlas_lang", lang); } catch (e) {}
  try {
    var u = new URL(location.href);
    u.searchParams.set("lang", lang);
    history.replaceState(null, "", u.toString());
  } catch (e) {}
  applyI18n();
  if (window.__lastDemoRendered) renderDemo();
  else if (window.__lastRender) {
    render(window.__lastRender.byTask, window.__lastRender.skills,
           window.__lastRender.samples, window.__lastRender.model);
    if (window.__lastFixes) renderFixes(window.__lastFixes.suggestions, window.__lastFixes.skills);
  }
}

// 解析 SKILL.md 的 frontmatter（name/description，支持 > 折行与 | 字面块标量）
function parseSkillMd(text, fallbackName) {
  var body = String(text).replace(/\r\n/g, "\n");
  var m = body.match(/^---\n([\s\S]*?)\n---/);
  if (!m) return { name: fallbackName || "", description: "", issues: ["缺少 frontmatter"] };
  var lines = m[1].split("\n"), fm = {};
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    if (!line.trim() || line.trim().charAt(0) === "#" || line.indexOf(":") < 0) continue;
    var idx = line.indexOf(":");
    var key = line.slice(0, idx).trim();
    var val = line.slice(idx + 1).trim();
    if (/^[>|][+-]?$/.test(val)) {
      var block = [];
      for (i++; i < lines.length; i++) {
        var l = lines[i];
        if (l.charAt(0) !== " " && l.charAt(0) !== "\t" && l.trim()) break;
        block.push(l.trim());
      }
      i--;
      while (block.length && !block[block.length - 1]) block.pop();
      fm[key] = val.charAt(0) === ">" ? block.filter(Boolean).join(" ") : block.join("\n");
    } else {
      fm[key] = val.replace(/^["']|["']$/g, "");
    }
  }
  return { name: fm.name || fallbackName || "", description: fm.description || "", issues: [] };
}

// 纯函数：把 [{path, folder, text}] 转成网页粘贴行（便于测试）
function skillFolderRows(items) {
  var rows = [], skipped = [];
  items.forEach(function(it) {
    var e = parseSkillMd(it.text, it.folder);
    if (!e.description) { skipped.push((e.name || it.folder || it.path) + t("skip_no_desc")); return; }
    rows.push({ name: e.name, description: e.description.replace(/\s*\n\s*/g, " ").trim() });
  });
  return { rows: rows, skipped: skipped };
}

// 纯函数：从文件列表挑出 SKILL.md（跳过隐藏目录与噪音目录，与 CLI 的 _iter_skill_mds 一致）
var NOISE_DIRS = ["node_modules", "__pycache__", "output", "build", "dist", "venv"];

function selectSkillMdFiles(list) {
  var picked = [], hidden = 0;
  list.forEach(function(f) {
    var rel = f.webkitRelativePath || f.name || "";
    if (!/(^|\/)SKILL\.md$/i.test(rel)) return;
    var parts = rel.split("/");
    var dirs = parts.slice(1, -1);  // 去掉所选目录本身与文件名
    var noisy = dirs.some(function(d) {
      return d.charAt(0) === "." || NOISE_DIRS.indexOf(d) >= 0;
    });
    if (noisy) { hidden++; return; }
    picked.push({ path: rel, folder: dirs.length ? dirs[dirs.length - 1] : "", file: f, text: "" });
  });
  return { picked: picked, hidden: hidden };
}

// 提示行按状态渲染，切换语言时可直接重绘
function refreshPickHint() {
  var ph = document.getElementById("pickHint");
  if (!ph) return;
  var st = window.__pickState;
  if (!st) { ph.textContent = t("pick_hint"); return; }
  var sep = LANG === "zh" ? "、" : ", ";
  if (st.kind === "reading") ph.textContent = t("pick_reading", { n: st.n });
  else if (st.kind === "notFound") ph.textContent = t("pick_not_found");
  else if (st.kind === "hiddenOnly") ph.textContent = t("pick_only_hidden", { skip: t("skip_hidden", { n: st.hidden }) });
  else if (st.kind === "noDesc") ph.textContent = t("pick_no_desc");
  else if (st.kind === "done") {
    ph.textContent = t("pick_done", {
      n: st.rows,
      skipped: st.skipped.length ? t("skip_list", { n: st.skipped.length, list: st.skipped.join(sep) }) : "",
      skip: st.hidden ? t("skip_hidden", { n: st.hidden }) : "" });
  }
}

function handleFolderPicked(input) {
  var all = Array.prototype.slice.call(input.files || []);
  var sel = selectSkillMdFiles(all);
  var items = sel.picked;
  if (!items.length) {
    window.__pickState = sel.hidden ? { kind: "hiddenOnly", hidden: sel.hidden } : { kind: "notFound" };
    refreshPickHint();
    input.value = "";
    return;
  }
  window.__pickState = { kind: "reading", n: items.length };
  refreshPickHint();
  Promise.all(items.map(function(it) {
    return it.file.text().then(function(t) { it.text = t; }, function() { it.text = ""; });
  })).then(function() {
    var res = skillFolderRows(items);
    if (!res.rows.length) {
      window.__pickState = { kind: "noDesc" };
      refreshPickHint();
      input.value = "";
      return;
    }
    document.getElementById("skills").value = res.rows.map(function(r) {
      return r.name + ": " + r.description;
    }).join("\n");
    window.__pickState = { kind: "done", rows: res.rows.length, hidden: sel.hidden,
                           skipped: res.skipped.slice() };
    refreshPickHint();
    input.value = "";
  });
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

$("provider").addEventListener("change", function() {
  $("baseRow").classList.toggle("hidden", this.value !== "openai");
  saveCfg();
});
$("key").addEventListener("input", saveCfg);
$("model").addEventListener("input", saveCfg);
$("base").addEventListener("input", saveCfg);
$("remember").addEventListener("change", saveCfg);

function saveCfg() {
  try {
    if (!$("remember").checked) {
      // 取消记住 = 清掉已保存的配置和 Key，而不是只停止后续保存
      localStorage.removeItem("atlas_cfg");
      return;
    }
    localStorage.setItem("atlas_cfg", JSON.stringify(getCfg()));
  } catch (e) {}
}
function loadSaved() {
  try {
    var c = JSON.parse(localStorage.getItem("atlas_cfg") || "null");
    if (!c) return;
    if (c.provider && c.provider !== "demo") $("provider").value = c.provider;
    if (c.key) $("key").value = c.key;
    if (c.model) $("model").value = c.model;
    if (c.base) $("base").value = c.base;
    $("baseRow").classList.toggle("hidden", $("provider").value !== "openai");
  } catch (e) {}
}

function getCfg() {
  return { provider: $("provider").value, key: $("key").value.trim(),
           model: $("model").value.trim(), base: $("base").value.trim() };
}

function parseSkills(text) {
  var out = [], errs = [], seen = {};
  text.split("\n").forEach(function(line, i) {
    line = line.trim();
    if (!line) return;
    var sep = line.search(/[:：|｜]/);
    if (sep < 1) { errs.push(t("err_line_no_sep", { n: i + 1 })); return; }
    var name = line.slice(0, sep).trim(), desc = line.slice(sep + 1).trim();
    if (!NAME_RE.test(name)) { errs.push(t("err_name_invalid", { n: i + 1, name: name })); return; }
    if (!desc) { errs.push(t("err_desc_empty", { n: i + 1 })); return; }
    if (seen[name]) { errs.push(t("err_dup_name", { name: name })); return; }
    seen[name] = 1;
    out.push({ name: name, description: desc });
  });
  return { skills: out, errs: errs };
}

function parseTasks(text) {
  var out = [], errs = [];
  text.split("\n").forEach(function(line, i) {
    line = line.trim();
    if (!line) return;
    var m = line.match(/^(.*?)\s*=>\s*([a-zA-Z0-9-]+)\s*$/);  // NONE 为大写合法预期值
    if (m) out.push({ task: m[1].trim(), expected: m[2] });
    else out.push({ task: line, expected: null });
    if (m && !m[2]) errs.push(t("err_task_empty", { n: i + 1 }));
  });
  return { tasks: out, errs: errs };
}

function buildCatalog(skills) {
  return skills.map(function(s, i) {
    return (i + 1) + ". name: " + s.name + "\n   description: " + s.description;
  }).join("\n");
}

// 规则同步警告：本文件的 SYSTEM_PROMPT（zh 版与 CLI 逐字一致，en 版为等价英文）、CONSISTENCY_MIN(0.8)、冲突判定规则
// 与 skill_seam.py（CLI 版）保持一致，任何一边修改必须同步另一边。
var SYSTEM_PROMPT = t("prompt_select");
var CONSISTENCY_MIN = 0.8;

function extractChosen(content, names) {
  var m = content.match(/"chosen"\s*:\s*"([^"]+)"/);
  if (m) { var v = m[1].trim();
    if (v === "NONE" || names.indexOf(v) >= 0) return v; }
  var s = content.trim();
  if (s === "NONE" || names.indexOf(s) >= 0) return s;
  var m2 = content.match(/chosen['"]?\s*[:=]\s*['"]?([A-Za-z0-9-]+)/);
  if (m2 && (m2[1] === "NONE" || names.indexOf(m2[1]) >= 0)) return m2[1];
  return "INVALID";
}

var EVAL_TIMEOUT_MS = 90000;  // 单请求应用层超时

var activeCtrls = [];         // 在途请求的控制器，停止评测时统一 abort

function llmCall(cfg, base, messages, maxTokens) {
  var ctrl = new AbortController();
  activeCtrls.push(ctrl);
  var timer = setTimeout(function() { ctrl.abort(); }, EVAL_TIMEOUT_MS);
  var system = "", userMsgs = [];
  messages.forEach(function(m) {
    if (m.role === "system") system = m.content;
    else userMsgs.push(m);
  });
  if (cfg.provider === "anthropic") {
    // Anthropic Messages API：system 独立传参，需特殊头才允许浏览器直连
    return fetch(base.replace(/\/+$/, "") + "/messages", {
      method: "POST",
      headers: { "x-api-key": cfg.key, "anthropic-version": "2023-06-01",
                 "anthropic-dangerous-direct-browser-access": "true",
                 "Content-Type": "application/json" },
      signal: ctrl.signal,
      body: JSON.stringify({ model: cfg.model, temperature: 0.7, max_tokens: maxTokens,
        system: system, messages: userMsgs })
    }).then(function(r) {
      if (!r.ok) return r.text().then(function(t) {
        throw new Error("HTTP " + r.status + ": " + t.slice(0, 160)); });
      return r.json();
    }).then(function(d) {
      var part = (d.content || []).filter(function(c) { return c.type === "text"; })[0];
      return part ? part.text : "";
    }).finally(function() {
      // 覆盖正文读取、网络失败与用户取消三种情况
      clearTimeout(timer);
      var i = activeCtrls.indexOf(ctrl);
      if (i >= 0) activeCtrls.splice(i, 1);
    });
  }
  return fetch(base.replace(/\/+$/, "") + "/chat/completions", {
    method: "POST",
    headers: { "Authorization": "Bearer " + cfg.key, "Content-Type": "application/json" },
    signal: ctrl.signal,
    body: JSON.stringify({ model: cfg.model, temperature: 0.7, max_tokens: maxTokens,
      messages: messages })
  }).then(function(r) {
    if (!r.ok) return r.text().then(function(t) {
      throw new Error("HTTP " + r.status + ": " + t.slice(0, 160)); });
    return r.json();
  }).then(function(d) { return d.choices[0].message.content; })
    .finally(function() {
      clearTimeout(timer);
      var i = activeCtrls.indexOf(ctrl);
      if (i >= 0) activeCtrls.splice(i, 1);
    });
}

function chatCall(cfg, base, catalog, task) {
  return llmCall(cfg, base, [
    { role: "system", content: SYSTEM_PROMPT },
    { role: "user", content: t("prompt_catalog", { catalog: catalog, task: task }) }
  ], 60);
}

function parseJSONLoose(content) {
  try { return JSON.parse(content); } catch (e) {}
  var m = content.match(/\[[\s\S]*\]|\{[\s\S]*\}/);  // 不用 /s 标志，兼容老版 Safari
  if (m) { try { return JSON.parse(m[0]); } catch (e) {} }
  return null;
}

// ---------------- 任务自动生成（与 skill_seam.py 的 generate_tasks_real 保持一致） ----------------
var GEN_POS_PROMPT = t("prompt_gen_pos");
var GEN_GRAY_PROMPT = t("prompt_gen_gray");

function llmPickPairs(cfg, base, skills, k) {
  var byName = {}, listing = [];
  skills.forEach(function(s) { byName[s.name] = s; listing.push("- " + s.name + ": " + s.description); });
  var prompt = t("prompt_gen_pairs", { n: skills.length, k: k, listing: listing.join("\n") });
  return llmCall(cfg, base, [
    { role: "system", content: t("prompt_gen_sys") }, { role: "user", content: prompt }], 500)
    .then(function(content) {
      var obj = parseJSONLoose(content) || {};
      var pairs = [], seen = {};
      (obj.pairs || []).forEach(function(p) {
        if (Array.isArray(p) && p.length === 2 && byName[p[0]] && byName[p[1]] && p[0] !== p[1]) {
          var key = [p[0], p[1]].sort().join("|");
          if (!seen[key]) { seen[key] = 1; pairs.push([byName[p[0]], byName[p[1]]]); }
        }
      });
      return pairs.slice(0, k);
    }).catch(function() { return []; });
}

function genTasksAuto(cfg, base, skills, nPos, kPairs) {
  var warnings = [];
  var allNames = skills.map(function(s) { return s.name; });
  var seenText = {};
  function genPositive(s) {
    var prompt = t("prompt_skill_name") + s.name + t("prompt_skill_desc") + s.description + "\n\n" +
      GEN_POS_PROMPT.replace("{n}", nPos);
    return llmCall(cfg, base, [
      { role: "system", content: t("prompt_gen_sys") }, { role: "user", content: prompt }], 800)
      .then(function(content) {
        var arr = parseJSONLoose(content);
        if (!Array.isArray(arr)) return [];
        // 泄题过滤：任务文本含任何技能名都会让选择器作弊；全局去重防一题两属
        var clean = arr.map(String).map(function(t) { return t.trim(); })
          .filter(function(t) {
            if (!t || seenText[t]) return false;
            var leaks = allNames.some(function(n) { return t.indexOf(n) >= 0; });
            if (!leaks) seenText[t] = 1;
            return !leaks;
          });
        return clean.slice(0, nPos).map(function(t) {
          return { t: t, e: s.name, kind: "positive" };
        });
      }).catch(function() {
        warnings.push(s.name + " 正向任务生成失败，已跳过");
        return [];
      });
  }
  function genGray(a, b) {
    var prompt = GEN_GRAY_PROMPT.replace("{n}", 3);
    var body = t("prompt_gray_a") + a.name + t("prompt_gray_da") + a.description +
               t("prompt_gray_b") + b.name + t("prompt_gray_db") + b.description;
    return llmCall(cfg, base, [
      { role: "system", content: t("prompt_gen_sys") }, { role: "user", content: body + "\n\n" + prompt }], 900)
      .then(function(content) {
        var obj = parseJSONLoose(content);
        if (!obj || typeof obj !== "object") return [];
        var pair = a.name + "↔" + b.name, out = [];
        function add(t, e) {
          t = String(t).trim();
          if (!t || seenText[t]) return;
          if (allNames.some(function(n) { return t.indexOf(n) >= 0; })) return;
          seenText[t] = 1;
          out.push({ t: t, e: e, kind: "gray", pair: pair });
        }
        (obj.first || []).slice(0, 3).forEach(function(t) { add(t, a.name); });
        (obj.second || []).slice(0, 3).forEach(function(t) { add(t, b.name); });
        return out;
      }).catch(function() {
        warnings.push(a.name + "↔" + b.name + " 灰区任务生成失败，已跳过");
        return [];
      });
  }
  return llmPickPairs(cfg, base, skills, kPairs).then(function(pairs) {
    var jobs = skills.map(function(s) { return genPositive(s); });
    pairs.forEach(function(p) { jobs.push(genGray(p[0], p[1])); });
    return Promise.all(jobs).then(function(groups) {
      var tasks = [];
      groups.forEach(function(g) { tasks = tasks.concat(g); });
      return { tasks: tasks, warnings: warnings };
    });
  });
}

function genTasks() {
  hideErr();
  var ps = parseSkills($("skills").value);
  if (ps.errs.length) { showErr(ps.errs.join("\n")); return; }
  if (ps.skills.length < 2) { showErr(t("err_need_two")); return; }
  var cfg = getCfg();
  if (cfg.provider === "demo") { showErr(t("err_gen_endpoint")); return; }
  if (!cfg.key) { showErr(t("err_need_key")); return; }
  if (cfg.provider === "openai" && !cfg.base) { showErr(t("err_need_base")); return; }
  if (!cfg.model) { showErr(t("err_need_model")); return; }
  saveCfg();
  var base = cfg.provider === "openai" ? cfg.base : PROVIDER_BASE[cfg.provider];
  var nPos = parseInt($("genPos").value, 10);
  var kPairs = parseInt($("grayPairs").value, 10);
  setRunning(true);
  showStatus(t("gen_status", { s: ps.skills.length, p: nPos, k: kPairs }));
  genTasksAuto(cfg, base, ps.skills, nPos, kPairs).then(function(r) {
    setRunning(false);
    hideStatus();
    if (!r.tasks.length) { showErr(t("gen_empty") + (r.warnings.length ? "：" + r.warnings.join("；") : "")); return; }
    // 追加而非覆盖：用户可能已手写任务
    var generated = r.tasks.map(function(t) {
      return t.t + " => " + t.e;
    }).join("\n");
    var existing = $("tasks").value.trim();
    $("tasks").value = existing ? existing + "\n" + generated : generated;
    if (r.warnings.length) showErr(t("gen_partial", { w: r.warnings.join("；"), n: r.tasks.length }));
    else showStatus(t("gen_done", { n: r.tasks.length }));
  });
}

function showStatus(msg) {
  var e = $("errbox");
  e.style.background = "#eaf3de"; e.style.color = "#27500a";
  e.style.display = "block";
  e.textContent = msg;
}
function hideStatus() {
  var e = $("errbox");
  e.style.background = ""; e.style.color = "";
}

// ---------------- 修复建议（与 skill_seam.py 的 generate_fix_suggestions 保持一致） ----------------
var FIX_PROMPT = t("prompt_fix");

function genFixes(cfg, base, rows, skillsByName) {
  var pairs = {}, order = [];
  rows.forEach(function(r) {
    if (!r.conflict || !skillsByName[r.chosen]) return;
    var key = r.expected + "→" + r.chosen;
    if (!pairs[key]) { pairs[key] = []; order.push(key); }
    pairs[key].push(r);
  });
  var jobs = order.slice(0, 5).map(function(key) {
    var parts = key.split("→"), victim = parts[0], thief = parts[1];
    var v = skillsByName[victim], t = skillsByName[thief];
    var rs = pairs[key];
    var taskList = rs.slice(0, 5).map(function(r) { return "- " + r.task; }).join("\n");
    var prompt = FIX_PROMPT.replace("{thief}", thief).replace("{victim}", victim)
      .replace("{vdesc}", v.description).replace("{tdesc}", t.description)
      .replace("{tasks}", taskList);
    return llmCall(cfg, base, [
      { role: "system", content: "你是 prompt 工程专家，只输出 JSON。" }, { role: "user", content: prompt }], 900)
      .then(function(content) {
        var obj = parseJSONLoose(content) || {};
        var valid = [];
        (obj.changes || []).forEach(function(c) {
          if (c && (c.skill === victim || c.skill === thief) && c.new_description &&
              String(c.new_description).length <= 1024) {
            valid.push({ skill: c.skill, new_description: String(c.new_description).trim(),
                         reason: String(c.reason || "").trim() });
          }
        });
        return valid.length ? { victim: victim, thief: thief,
          conflict_tasks: rs.slice(0, 3).map(function(r) { return r.task; }), changes: valid } : null;
      }).catch(function() { return null; });
  });
  return Promise.all(jobs).then(function(list) {
    return list.filter(function(x) { return x; });
  });
}

function renderFixes(suggestions, skills) {
  var byName = {};
  skills.forEach(function(s) { byName[s.name] = s; });
  var html = "";
  suggestions.forEach(function(s) {
    s.changes.forEach(function(c) {
      var oldDesc = byName[c.skill] ? byName[c.skill].description : "";
      html += '<div class="fix"><div class="fixhead">' + t("fix_head", { name: chip(c.skill) }) +
        '<span class="fixreason">' + t("fix_note", { victim: chip(s.victim), thief: chip(s.thief, "red") }) + '</span></div>' +
        '<div class="fixold"><b>' + t("fix_old") + '</b>: ' + esc(oldDesc) + '</div>' +
        '<div class="fixnew"><b>' + t("fix_new") + '</b>: ' + esc(c.new_description) + '</div>' +
        '<div class="fixreason">' + t("fix_reason") + esc(c.reason) + '</div></div>';
    });
  });
  if (!html) {
    html = '<div class="hint">' + t("fix_no_suggestions") + '</div>';
  }
  $("fixes").innerHTML = html;
  window.__lastFixes = { suggestions: suggestions, skills: skills };
  $("fixCard").classList.remove("hidden");
}

function pool(jobs, n, onProgress) {
  // 约定：job 函数直接返回最终结果对象 { value } / { stopped: true } / { error }，
  // pool 只做赋值，不再二次包装；catch 仅兜底意外异常
  var i = 0, completed = 0;
  var results = new Array(jobs.length);
  function worker() {
    if (i >= jobs.length) return Promise.resolve();
    var cur = i++;
    return Promise.resolve().then(jobs[cur])
      .then(function(v) { results[cur] = v; })
      .catch(function(e) { results[cur] = { error: String((e && e.message) || e) }; })
      .then(function() {
        completed++;
        onProgress(completed);
        return worker();
      });
  }
  return Promise.all(Array.from({ length: Math.min(n, jobs.length) }, worker))
    .then(function() { return results; });
}

var evalStopped = false;
function stopEval() {
  evalStopped = true;
  // 取消在途请求，而不是只阻止后续请求发出
  activeCtrls.forEach(function(c) { try { c.abort(); } catch (e) {} });
}

function setRunning(on) {
  $("runBtn").disabled = on; $("demoBtn").disabled = on; $("genBtn").disabled = on;
  var sb = $("stopBtn");
  sb.classList.toggle("hidden", !on);
  sb.disabled = false;
}

function run() {
  hideErr();
  var ps = parseSkills($("skills").value);
  var pt = parseTasks($("tasks").value);
  var errs = ps.errs.concat(pt.errs);
  if (ps.skills.length < 2) errs.push("至少需要 2 个技能");
  if (!pt.tasks.length) errs.push("至少需要 1 条测试任务");
  if (errs.length) { showErr(errs.join("\n")); return; }

  var cfg = getCfg();
  var samples = parseInt($("samples").value, 10);
  if (!(samples >= 1)) { showErr(t("err_samples")); return; }
  if (cfg.provider === "demo") { renderDemo(); return; }
  if (!cfg.key) { showErr("请填写 API Key（或先选「演示模式」看效果）"); return; }
  if (cfg.provider === "openai" && !cfg.base) { showErr("OpenAI-compatible 需要填写 Base URL"); return; }
  if (!cfg.model) { showErr("请填写模型名"); return; }
  saveCfg();

  var names = ps.skills.map(function(s) { return s.name; });
  var nameSet = {};
  names.forEach(function(n) { nameSet[n] = 1; });
  var badTag = pt.tasks.filter(function(t) { return t.expected && t.expected !== "NONE" && !nameSet[t.expected]; });
  if (badTag.length) {
    showErr("有 " + badTag.length + " 条任务的 => 标注指向不存在的技能，例如: " +
            esc(badTag[0].task.slice(0, 20)) + " => " + badTag[0].expected);
    return;
  }

  var catalog = buildCatalog(ps.skills);
  var base = cfg.provider === "openai" ? cfg.base : PROVIDER_BASE[cfg.provider];
  var jobs = [];
  pt.tasks.forEach(function(t) {
    for (var j = 0; j < samples; j++) {
      jobs.push(function(task) {
        return function() {
          if (evalStopped) return { stopped: true };
          return chatCall(cfg, base, catalog, task).then(function(text) {
            return { value: text };
          }, function(e) {
            return evalStopped ? { stopped: true } : { error: String(e && e.message || e) };
          });
        };
      }(t.task));
    }
  });

  evalStopped = false;
  setRunning(true);
  $("bar").style.display = "block";
  var done = 0;
  pool(jobs, 4, function(n) {
    done = n;
    $("barfill").style.width = (100 * n / jobs.length).toFixed(1) + "%";
  }).then(function(results) {
    setRunning(false);
    $("bar").style.display = "none";
    var byTask = [], k = 0, fatal = 0, firstErr = "", stopped = evalStopped;
    pt.tasks.forEach(function(t) {
      var votes = [];
      for (var j = 0; j < samples; j++) {
        var r = results[k++];
        if (r && r.stopped) { votes.push("STOPPED"); stopped = true; }
        else if (r && r.error) { votes.push("ERROR"); fatal++; if (!firstErr) firstErr = r.error; }
        else if (r && typeof r.value === "string") votes.push(extractChosen(r.value, names));
        else { votes.push("ERROR"); fatal++; if (!firstErr) firstErr = "未知结果"; }
      }
      byTask.push({ task: t.task, expected: t.expected, votes: votes });
    });
    // 测试钩子：流程测试直接断言内部结果，不依赖提示文字
    if (typeof globalThis.__atlasHook === "function") {
      var stoppedCount = 0;
      byTask.forEach(function(bt) {
        bt.votes.forEach(function(v) { if (v === "STOPPED") stoppedCount++; });
      });
      globalThis.__atlasHook(byTask, { fatal: fatal, stoppedCount: stoppedCount });
    }
    if (fatal === results.length) {
      showErr("全部请求失败。常见原因：key 无效、端点不允许浏览器直连（CORS）、模型名错误。\n" + firstErr);
      return;
    }
    if (fatal > 0) {
      showErr("注意：" + fatal + " 个请求失败（已计为 ERROR）。首个错误：" + firstErr);
    }
    window.__lastRender = { byTask: byTask, skills: ps.skills, samples: samples, model: cfg.model };
    render(byTask, ps.skills, samples, cfg.model);
    if (stopped) {
      showErr(t("run_stopped"));
      return;
    }
    // 有稳定冲突时自动生成修复建议（BYOK 模式专属能力）
    var conflicts = byTask.filter(function(t) { return t.expected; })
      .map(function(t) {
        var maj = majority(t.votes);
        var stable = maj.consistency >= CONSISTENCY_MIN &&
                     maj.chosen !== "ERROR" && maj.chosen !== "INVALID" && maj.chosen !== "STOPPED";
        return { task: t.task, expected: t.expected, chosen: maj.chosen, stable: stable,
                 conflict: !!(stable && maj.chosen !== t.expected) };
      }).filter(function(r) { return r.conflict; });
    var byName = {};
    ps.skills.forEach(function(s) { byName[s.name] = s; });
    triggerFixGeneration(conflicts, byName, ps.skills, cfg, base);
  });
}

// 检测到稳定冲突后触发建议生成：预期 NONE（无受害技能可改写）自动跳过
function triggerFixGeneration(conflicts, byName, skills, cfg, base) {
  var fixable = conflicts.filter(function(r) { return byName[r.expected]; });
  if (!fixable.length) {
    hideStatus();
    $("fixCard").classList.add("hidden");
    return false;
  }
  showStatus("发现 " + conflicts.length + " 个稳定冲突，正在生成修复建议...");
  genFixes(cfg, base, fixable, byName).then(function(suggestions) {
    hideStatus();
    renderFixes(suggestions, skills);
  });
  return true;
}

function allSamplesInvalid(rows) {
  // 评测里没有取得任何有效选择结果（与 CLI 的"评测失败"判定保持一致）
  return rows.length > 0 && rows.every(function(r) {
    return r.chosen === "ERROR" || r.chosen === "INVALID";
  });
}

function majority(votes) {
  var c = {}, top = null, n = -1;
  votes.forEach(function(v) { c[v] = (c[v] || 0) + 1; });
  Object.keys(c).forEach(function(k) { if (c[k] > n) { top = k; n = c[k]; } });
  return { chosen: top, consistency: n / votes.length };
}

function longestHit(phrase, task) {
  var best = "";
  for (var i = 0; i + 2 <= phrase.length; i++) {
    for (var j = i + 2; j <= phrase.length; j++) {
      var sub = phrase.slice(i, j);
      if (sub.length > best.length && task.indexOf(sub) >= 0) best = sub;
    }
  }
  return best;
}

function conflictReason(chosenDesc, task) {
  var out = [];
  chosenDesc.split(/[，、。；：/（）\s]/).forEach(function(phrase) {
    if (phrase.length < 2 || STOPWORDS[phrase]) return;
    var best = longestHit(phrase, task);
    if (best && out.indexOf(best) < 0) out.push(best);
  });
  return out.slice(0, 6);
}

function render(byTask, skills, samples, model) {
  var names = skills.map(function(s) { return s.name; });
  var byName = {};
  skills.forEach(function(s) { byName[s.name] = s; });
  var CONS_MIN = 0.8;

  var rows = byTask.map(function(bt) {
    var maj = majority(bt.votes);
    var stable = maj.consistency >= CONS_MIN &&
                 maj.chosen !== "ERROR" && maj.chosen !== "INVALID" && maj.chosen !== "STOPPED";
    return { task: bt.task, expected: bt.expected, chosen: maj.chosen,
             consistency: maj.consistency, stable: stable,
             conflict: !!(bt.expected && stable && maj.chosen !== bt.expected) };
  });
  var tagged = rows.filter(function(r) { return r.expected; });
  var conflicts = tagged.filter(function(r) { return r.conflict; });
  var hits = tagged.filter(function(r) { return r.chosen === r.expected; }).length;
  var unstable = rows.filter(function(r) { return !r.stable; }).length;

  $("s-hit").textContent = hits + "/" + tagged.length;
  $("s-conf").textContent = conflicts.length;
  $("s-unstable").textContent = unstable;
  $("s-total").textContent = rows.length;
  $("skillStrip").innerHTML = t("strip_recognized", { n: skills.length }) +
    skills.map(function(s) { return chip(s.name); }).join("");

  var expNames = [];
  tagged.forEach(function(r) { if (expNames.indexOf(r.expected) < 0) expNames.push(r.expected); });
  var cols = expNames.slice();
  names.forEach(function(n) { if (cols.indexOf(n) < 0 && n !== "NONE") cols.push(n); });
  if (cols.indexOf("NONE") < 0) cols.push("NONE");
  var OTHER_COL = t("col_other");
  cols.push(OTHER_COL);
  var mat = expNames.map(function() { return cols.map(function() { return 0; }); });
  var rowIdx = {};
  expNames.forEach(function(n, i) { rowIdx[n] = i; });
  tagged.forEach(function(r) {
    var ci = cols.indexOf(r.chosen);
    if (ci < 0) ci = cols.indexOf(OTHER_COL);
    mat[rowIdx[r.expected]][ci]++;
  });
  var matSkills = expNames.map(function(n) {
    if (byName[n]) return { name: n, description: byName[n].description };
    return { name: n, description: n === "NONE" ? "不应触发任何技能" : n };
  });
  $("matrix").innerHTML = matrixSvg(mat, matSkills, cols);

  var ch = "";
  conflicts.forEach(function(r) {
    var badges = "";
    if (byName[r.chosen]) {
      badges = conflictReason(byName[r.chosen].description, r.task)
        .map(function(t) { return '<span class="badge">' + esc(t) + "</span>"; }).join("");
    }
    var expectLabel = r.expected === "NONE"
      ? t("conflict_overtake", { b: chip(r.chosen, "red") })
      : t("conflict_expect", { a: chip(r.expected), b: chip(r.chosen, "red") });
    ch += '<div class="conflict">「' + esc(r.task) + '」<br>' + expectLabel +
          t("votes", { n: Math.round(r.consistency * samples), m: samples }) +
          (badges ? "<br>" + t("keywords") + badges : "") + "</div>";
  });
  // 与 CLI 一致：没有任何有效选择结果时，明确报告评测失败，不给"无冲突"结论
  if (allSamplesInvalid(rows)) {
    ch = '<div class="conflict">' + t("eval_failed") + '</div>';
  }
  $("conflicts").innerHTML = ch ||
    '<div class="plain">' + t("no_conflicts") + '</div>';

  var pl = "";
  rows.forEach(function(r) {
    if (r.expected) return;
    var cls = r.stable ? "" : t("unstable_note", { n: Math.round(r.consistency * samples), m: samples });
    pl += '<div class="plain">' + t("plain_line", { task: esc(r.task), chosen: chip(r.chosen) }) +
          " " + cls + "</div>";
  });
  $("plains").innerHTML = pl ||
    '<div class="plain">' + t("no_plains") + '</div>';

  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
}

function loadDemo() {
  // 「看演示数据」：切到演示 provider 并渲染内置结果（无需 API Key）
  hideErr();
  $("provider").value = "demo";
  renderDemo();
}

// 取演示数据集：优先当前语言；缺该语言时回落英文（比回落到中文对非中文读者更可读）
function demoFor(lang) {
  return DEMO_BY_LANG[lang] || DEMO_BY_LANG.en || DEMO_BY_LANG.zh;
}

function renderDemo() {
  hideErr();
  // 演示数据分语言内置（各语言配自己的技能集与真实运行结果）
  var D = demoFor(LANG);
  $("skills").value = D.skills.map(function(s) { return s.name + ": " + s.desc; }).join("\n");
  $("fixCard").classList.add("hidden");  // 演示模式无修复建议，清掉 BYOK 运行残留
  var skills = D.skills.map(function(s) { return { name: s.name, description: s.desc }; });
  var svg = matrixSvg(D.matrix, skills, D.cols);
  $("s-hit").textContent = D.meta.hits + "/" + D.meta.total;
  $("s-conf").textContent = D.conflicts.length;
  $("s-unstable").textContent = D.meta.unstable;
  $("s-total").textContent = D.meta.total;
  $("skillStrip").innerHTML = t("strip_recognized", { n: skills.length }) +
    skills.map(function(s) { return chip(s.name); }).join("");
  window.__lastDemoRendered = true;
  $("matrix").innerHTML = svg;
  var ch = "";
  D.conflicts.forEach(function(c) {
    ch += '<div class="conflict">「' + esc(c.task) + '」<br>' +
          t("conflict_expect", { a: chip(c.expected), b: chip(c.chosen, "red") }) +
          t("votes_raw", { x: esc(c.votes) }) + "</div>";
  });
  $("conflicts").innerHTML = ch;
  $("plains").innerHTML = '<div class="plain">' + esc(D.meta.note) + '</div>';
  $("result").classList.remove("hidden");
  $("result").scrollIntoView({ behavior: "smooth" });
}

// 估算文本宽度（CJK 与 ASCII 不同宽度）
function estTextW(str, cjkPx, asciiPx) {
  var w = 0;
  for (var i = 0; i < str.length; i++) w += str.charCodeAt(i) > 255 ? cjkPx : asciiPx;
  return w;
}

// 行标签的辅助词：中文取首段中文（≤8 字），英文取前几个词（≤26 字符、掐掉尾部虚词）
function shortLabel(desc, fallback) {
  var d = String(desc || "");
  var m = d.match(/[\u4e00-\u9fff]+/);
  if (m) return m[0].slice(0, 8);
  var words = d.replace(/^[^A-Za-z0-9]+/, "").split(/\s+/).filter(Boolean);
  var STOP = { for: 1, and: 1, of: 1, the: 1, a: 1, an: 1, to: 1, in: 1, on: 1, with: 1 };
  var out = [];
  for (var i = 0; i < words.length; i++) {
    var next = out.length ? out.join(" ") + " " + words[i] : words[i];
    if (out.length >= 2 && next.length > 26) break;   // 至少留两个词，之后超长就停
    out.push(words[i]);
  }
  while (out.length > 2 && STOP[out[out.length - 1].toLowerCase().replace(/[^a-z-]/g, "")]) out.pop();
  return out.join(" ").replace(/[,\u2014-]+$/, "") || fallback;
}

function matrixSvg(mat, skills, cols) {
  var cellW = 86, cellH = 52, topH = 30;
  // 行标签做成玻璃胶囊，并按最长名字动态确定标签列宽（长技能名不再被裁切）
  var rowLabels = skills.map(function(s) {
    return s.name + "\u00b7" + shortLabel(s.description, s.name);
  });
  var labW = 190;
  rowLabels.forEach(function(t) {
    labW = Math.min(Math.max(labW, estTextW(t, 11.5, 6.3) + 26), 360);
  });
  var W = labW + cellW * cols.length + 20;
  var H = topH + cellH * skills.length + 56;
  var svg = ['<svg viewBox="0 0 ' + W + " " + H + '" width="100%" xmlns="http://www.w3.org/2000/svg">'];
  svg.push('<text x="' + labW + '" y="14" font-size="12" fill="#5f5e5a">' + esc(t("matrix_axis")) + "</text>");
  cols.forEach(function(c, ci) {
    var x = labW + ci * cellW;
    // 列头空间有限：超长截断，悬浮显示完整技能名
    var disp = c.length > 14 ? c.slice(0, 13) + "\u2026" : c;
    svg.push('<text x="' + (x + cellW / 2) + '" y="' + (topH - 8) +
      '" font-size="11" fill="#444441" text-anchor="middle">' + esc(disp) +
      (disp !== c ? "<title>" + esc(c) + "</title>" : "") + "</text>");
  });
  skills.forEach(function(s, ri) {
    var y = topH + ri * cellH;
    var label = rowLabels[ri];
    var tw = estTextW(label, 11.5, 6.3);
    while (tw > labW - 26 && label.length > 4) {
      label = label.slice(0, -2) + "\u2026";
      tw = estTextW(label, 11.5, 6.3);
    }
    // 玻璃胶囊底（与 .skill-chip 同风格）
    svg.push('<rect x="' + (labW - 19 - tw) + '" y="' + (y + cellH / 2 - 10) +
      '" width="' + (tw + 14) + '" height="20" rx="10" fill="rgba(255,255,255,0.65)"' +
      ' stroke="#d3d1c7" stroke-width="0.5"/>');
    svg.push('<text x="' + (labW - 12) + '" y="' + (y + cellH / 2) +
      '" font-size="11.5" fill="#0c447c" text-anchor="end">' + esc(label) + "</text>");
    cols.forEach(function(c, ci) {
      var x = labW + ci * cellW, v = mat[ri][ci];
      var fill, tcol;
      if (ri === ci) { fill = v ? "#c0dd97" : "#f1efe8"; tcol = "#27500a"; }
      else if (ci < skills.length) {
        fill = v ? "rgba(226,75,74," + Math.min(0.12 + v * 0.16, 0.88).toFixed(2) + ")" : "#f1efe8";
        tcol = v ? "#501313" : "#b4b2a9";
      } else { fill = v ? "#d3d1c7" : "#f1efe8"; tcol = "#444441"; }
      svg.push('<rect x="' + x + '" y="' + y + '" width="' + (cellW - 4) + '" height="' +
        (cellH - 4) + '" rx="6" fill="' + fill + '" stroke="#b4b2a9" stroke-width="0.5"/>');
      if (v) svg.push('<text x="' + (x + (cellW - 4) / 2) + '" y="' + (y + (cellH - 4) / 2 + 4) +
        '" font-size="13" fill="' + tcol + '" text-anchor="middle">' + v + "</text>");
    });
  });
  svg.push("</svg>");
  return svg.join("\n");
}
