name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cli-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run CLI test suite
        run: python tests/test_atlas.py
      - name: Package sanity (pip install + entry point)
        run: |
          python -m pip install .
          skill-atlas --version

  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Web JS syntax + logic smoke (25 assertions)
        run: node tests/web_smoke.cjs
