[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-seam"
version = "0.1.0"
description = "Simulate your agent's real skill-selection process and find out which skill steals whose tasks — before your users find out."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Snow7-G" }]
keywords = ["agent", "skills", "claude-code", "codex", "llm", "testing", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
skill-seam = "skill_seam:main"

[tool.setuptools]
py-modules = ["skill_seam"]
