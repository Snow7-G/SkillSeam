<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
<title id="title">From skill descriptions to reviewable changes</title><desc id="desc">Keep the task set fixed. Inspect the boundary. Recheck the change.</desc>
<rect width="1040" height="300" rx="18" fill="#f5f4f0"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="43" font-size="23" font-weight="600" fill="#2c2c2a">From skill descriptions to reviewable changes</text>
<text x="32" y="73" font-size="15" fill="#5f5e5a">Keep the task set fixed. Inspect the boundary. Recheck the change.</text>
<rect x="32" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 52 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="52" y="159" font-size="20" fill="#0f6e56">Prepare &amp; review</text>
<text x="52" y="193" font-size="15" fill="#2c2c2a">Skill names + descriptions</text>
<text x="52" y="220" font-size="15" fill="#5f5e5a">Real tasks + expected labels</text>
<path d="M 349 173 h 10 m -4 -4 l 4 4 -4 4" fill="none" stroke="#0f6e56" stroke-width="2"/>
<rect x="364" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 384 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="384" y="159" font-size="20" fill="#0f6e56">Inspect selections</text>
<text x="384" y="193" font-size="15" fill="#2c2c2a">Preflight → repeated samples</text>
<text x="384" y="220" font-size="15" fill="#5f5e5a">Conflicts · variation · coverage</text>
<path d="M 681 173 h 10 m -4 -4 l 4 4 -4 4" fill="none" stroke="#0f6e56" stroke-width="2"/>
<rect x="696" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 716 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="716" y="159" font-size="20" fill="#0f6e56">Validate edits</text>
<text x="716" y="193" font-size="15" fill="#2c2c2a">Before / after A/B comparison</text>
<text x="716" y="220" font-size="15" fill="#5f5e5a">A/A checks background variation</text>
<text x="32" y="279" font-size="13" fill="#5f5e5a">Workflow illustration · selection simulation, not execution of a live agent workflow</text></g></svg>