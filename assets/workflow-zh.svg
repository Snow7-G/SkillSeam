<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="300" viewBox="0 0 1040 300" role="img" aria-labelledby="title desc">
<title id="title">从技能描述，到可复核的修改结果</title><desc id="desc">同一批任务贯穿检查、修改和对照验证。</desc>
<rect width="1040" height="300" rx="18" fill="#f5f4f0"/>
<g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
<text x="32" y="43" font-size="23" font-weight="600" fill="#2c2c2a">从技能描述，到可复核的修改结果</text>
<text x="32" y="73" font-size="15" fill="#5f5e5a">同一批任务贯穿检查、修改和对照验证。</text>
<rect x="32" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 52 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="52" y="159" font-size="20" fill="#0f6e56">准备与审核</text>
<text x="52" y="193" font-size="15" fill="#2c2c2a">技能名称 + 描述</text>
<text x="52" y="220" font-size="15" fill="#5f5e5a">真实任务 + 预期标签</text>
<path d="M 349 173 h 10 m -4 -4 l 4 4 -4 4" fill="none" stroke="#0f6e56" stroke-width="2"/>
<rect x="364" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 384 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="384" y="159" font-size="20" fill="#0f6e56">检查选择</text>
<text x="384" y="193" font-size="15" fill="#2c2c2a">连接预检 → 重复采样</text>
<text x="384" y="220" font-size="15" fill="#5f5e5a">冲突 · 波动 · 覆盖缺口</text>
<path d="M 681 173 h 10 m -4 -4 l 4 4 -4 4" fill="none" stroke="#0f6e56" stroke-width="2"/>
<rect x="696" y="104" width="312" height="146" rx="10" fill="#ffffff" stroke="#d3d1c7"/>
<path d="M 716 132 h 24" stroke="#0f6e56" stroke-width="4"/>
<text x="716" y="159" font-size="20" fill="#0f6e56">验证修改</text>
<text x="716" y="193" font-size="15" fill="#2c2c2a">修改前后 A/B 对照</text>
<text x="716" y="220" font-size="15" fill="#5f5e5a">A/A 检查背景波动</text>
<text x="32" y="279" font-size="13" fill="#5f5e5a">流程示意 · 模拟技能选择，不执行真实 agent 工作流</text></g></svg>